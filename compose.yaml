services:
  db:
    image: postgres:17-alpine
    container_name: hogar_express_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hogar_express}
      POSTGRES_USER: ${POSTGRES_USER:-hogar_express}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hogar_express} -d ${POSTGRES_DB:-hogar_express}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hogar_express_backend
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.development}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change_me}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-true}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://localhost:8000}
      - POSTGRES_DB=${POSTGRES_DB:-hogar_express}
      - POSTGRES_USER=${POSTGRES_USER:-hogar_express}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DJANGO_LOG_LEVEL=${DJANGO_LOG_LEVEL:-INFO}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@example.test}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-change_me}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-10}
      - ENABLE_DEMO_DATA=${ENABLE_DEMO_DATA:-true}
      - ENABLE_ROLE_SIMULATOR=${ENABLE_ROLE_SIMULATOR:-true}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hogar_express_frontend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api/v1}
      - VITE_USE_MOCKS=${VITE_USE_MOCKS:-false}
      - VITE_ENABLE_ROLE_SIMULATOR=${VITE_ENABLE_ROLE_SIMULATOR:-true}

volumes:
  postgres_data:
  media_data:
  static_data:
